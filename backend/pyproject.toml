[project]
name = "nisar-pulse-backend"
version = "0.1.0"
description = "NISAR / SAR-Based Surface Change & Disaster Tracker Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
    "asf_search>=7.0.0",
    "earthaccess>=0.9.0",
    "rioxarray>=0.15.0",
    "h5py>=3.10.0",
    "rasterio>=1.3.9",
    "shapely>=2.0.2",
    "geopandas>=0.14.2",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0.80",
    "google-genai>=0.1.1",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501"]
